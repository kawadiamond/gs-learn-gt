<link rel="stylesheet" href="css/sample.css">
<title>じゃんけん</title>
</head>
<body>

<header>
  <h1>じゃんけんゲーム</h1>
</header>

<section>
  <h2>ユーザーの手</h2>
  <ul>
    <li id="gu_btn">グー</li>
    <li id="cho_btn">チョキ</li>
    <li id="par_btn">パー</li>
  </ul>
 <!---<div>コンピュータの出した手は？「<span id="pc_hands">なに？</span>」</div>  -->
 <!--  <div id="judgment">判定</div>    -->
</section>
<section>
  <svg id="amidakuji-svg" class="svg-canvas" viewBox="0 0 1000 480">
     <h2>ユーザーの手1</h2>
  <ul>
    <li id="gu_btnn">グー1</li>
    <li id="cho_btnn">チョキ1</li>
    <li id="par_btnn">パー1</li>
  </ul>
    <!-- 下地のあみだ枠（縦3本 + 横3本） -->
    <g class="ladder-bg">
      <!-- 縦線（X: 50, 130, 210） -->
      <line x1="150"  y1="0" x2="50"  y2="290" />
      <line x1="500" y1="0" x2="130" y2="290" />
      <line x1="1000" y1="0" x2="210" y2="290" />

      <!-- 横棒 -->
      <line x1="50"  y1="80"  x2="130" y2="80" />
      <line x1="130"  y1="80"  x2="210" y2="80" />
      <line x1="130" y1="150" x2="210" y2="150" />
      <line x1="50"  y1="220" x2="130" y2="220" />
    </g>

    <!-- 各スタートごとの走破ルート -->
    <!-- 左スタート：(50,20) → (50,80) → 右へ(130,80) → (130,150) → 右へ(210,150) → 下端(210,290) [右ゴール] -->
    <path id="path-left" class="runner-path" fill="none"
          d="M 50,20 L 50,80 L 130,80 L 130,150 L 210,150 L 210,290" />

    <!-- 中スタート：(130,20) → (130,80) → 左へ(50,80) → (50,220) → 右へ(130,220) → 下端(130,290) [中ゴール] -->
    <path id="path-center" class="runner-path"
          d="M 130,20 L 130,80 L 50,80 L 50,220 L 130,220 L 130,290" />

    <!-- 右スタート：(210,20) → (210,150) → 左へ(130,150) → (130,220) → 左へ(50,220) → 下端(50,290) [左ゴール] -->
    <path id="path-right" class="runner-path"
          d="M 210,20 L 210,150 L 130,150 L 130,220 L 50,220 L 50,290" />
  </svg>
</section>




<section>
  <ul>
    <li id="computergu_btn">グー</li>
    <li id="computercho_btn">チョキ</li>
    <li id="computerpar_btn">パー</li>
  </ul>
</section>
<h2>コンピューターの手</h2>
<footer></footer>
<script>

// ユーザ & コンピューター選択 //
// //ユーザー"グー"選択
let hand_c="0";
let hand_u="0";

//グー選択の場合
$("#gu_btn").on("click",function(){ 
  let hand_u=1;
  let hand_c=Math.ceil(Math.random()*3);
//コンピューターの手
if(hand_c==1){
  $("#pc_hands").html('<span>グー</span>');
}else if(hand_c==2){
  $("#pc_hands").html('<span>チョキ</span>');
} else if(hand_c==3){
  $("#pc_hands").html('<span>パー</span>');
};
  //勝利判定
if((hand_u ==1 && hand_c==2) || (hand_u ==2 && hand_c==3) || (hand_u == 3 && hand_c==1)){
    $("#judgment").html("<div>YOU Win</div>");
}else if (hand_u == hand_c == 1){
    $("#judgment").html("<div>Draw</div>");
} else {
   $("#judgment").html("<div>You Lost</div>");
}
});
