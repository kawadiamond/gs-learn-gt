<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    /* 1. bodyの標準マージンを消して端まで密着させる */
    body {
      margin: 0;
      padding: 0;
    }
    .square-btn {
      display: block;           /* インライン要素特有の余白を排除 */
      width: 100%;
      height: 100%;
      margin: 0;                /* デフォルトの余白を完全リセット */
      padding: 0;
      box-sizing: border-box;   /* 枠線を含めてピッタリ100px×40pxに収める */
      border: 1px solid #1d4ed8;
      border-radius: 0;
      background-color: #2563eb;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
    }
    .button-grid{
     display: flex;
    }

    /* 2. SVGを横幅100%にし、インライン要素特有の下部隙間を防ぐ */
    .svg-canvas {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <svg id="amidakuji-svg" class="svg-canvas" viewBox="300 200 ">
    
<!-- <rect x="10" y="25" width="300" height="200" fill="#1600FC" />
  <text x="100" y="75" font-size="12" text-anchor="middle" dominant_baseline="middle">1</text>
  <text x="60"   y="20" font-size="12" text-anchor="middle">2</text>
  <text x="90" y="20" font-size="12" text-anchor="middle">3</text> -->

  <!-- ボタンの配置枠（x, y は左上の座標） -->
   <foreignObject x="10" y="10" width="calc(100% - 20px)" height="180">
     <div class="button-grid" xmlns="http://www.w3.org/1999/xhtml">
      <button class="square-btn" type="button">グー1</button>
      <button class="square-btn" type="button">グー2</button>
      <button class="square-btn" type="button">グー3</button>
      <!-- <button class="square-btn" type="button">パー</button> -->
    </div>
    </foreignObject>
<!-- 1. 上部のボタン（4つ並び：x=20, 110, 200, 290） -->
    <!-- 各ボタンの横幅60px、高さ36px。各縦線のX座標(50, 140, 230, 320)の中心に配置 -->
    <foreignObject x="20" y="20" width="60" height="36">
      <button class="amida-btn" data-col="0" xmlns="http://www.w3.org/1999/xhtml">A</button>
    </foreignObject>
    <foreignObject x="110" y="20" width="60" height="36">
      <button class="amida-btn" data-col="1" xmlns="http://www.w3.org/1999/xhtml">B</button>
    </foreignObject>
    <foreignObject x="200" y="20" width="60" height="36">
      <button class="amida-btn" data-col="2" xmlns="http://www.w3.org/1999/xhtml">C</button>
    </foreignObject>
    <foreignObject x="290" y="20" width="60" height="36">
      <button class="amida-btn" data-col="3" xmlns="http://www.w3.org/1999/xhtml">D</button>
    </foreignObject>

<!-- 2. あみだくじの縦線（y=70 から y=370 まで） -->
    <g class="amida-line">
      <!-- 1本目 (X: 50) -->
      <line x1="50"  y1="70" x2="50"  y2="370" />
      <!-- 2本目 (X: 140) -->
      <line x1="140" y1="70" x2="140" y2="370" />
      <!-- 3本目 (X: 230) -->
      <line x1="230" y1="70" x2="230" y2="370" />
      <!-- 4本目 (X: 320) -->
      <line x1="320" y1="70" x2="320" y2="370" />

      <!-- 3. あみだくじの横線（縦線と縦線をつなぐ） -->
      <line x1="50"  y1="120" x2="140" y2="120" /> <!-- A - B -->
      <line x1="230" y1="150" x2="320" y2="150" /> <!-- C - D -->
      <line x1="140" y1="200" x2="230" y2="200" /> <!-- B - C -->
      <line x1="50"  y1="250" x2="140" y2="250" /> <!-- A - B -->
      <line x1="140" y1="300" x2="230" y2="300" /> <!-- B - C -->
      <line x1="230" y1="330" x2="320" y2="330" /> <!-- C - D -->
    </g>



       <foreignObject x="10" y="100" width="calc(100% - 20px)" height="180">
     <div class="button-grid" xmlns="http://www.w3.org/1999/xhtml">
      <button class="square-btn" type="button">グー3</button>
      <button class="square-btn" type="button">グー3</button>
      <button class="square-btn" type="button">グー4</button>
      <!-- <button class="square-btn" type="button">パー</button> -->
    </div>
    </foreignObject>

  </svg>
  
</body>
</html>
