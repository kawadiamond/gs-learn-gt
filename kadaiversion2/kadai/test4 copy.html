<!DOCTYPE html>

<style>
/* ===== ページ全体 ===== */
body {
  font-size: 16px;               /* sample.css の 32px を上書き */
  font-family: "Hiragino Sans", "Meiryo", sans-serif;
  background-color: #f3f4f6;
  color: #333;
}
header h1 {
  margin: 0;
  padding: 12px 0;
  font-size: 24px;
}
main {
  max-width: 480px;
  margin: 24px auto;
  padding: 16px 20px 24px;
  background-color: #fff;
  border-radius: 12px;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  text-align: center;
}
main h1 {
  font-size: 20px;
  margin: 8px 0 16px;
}

/* ===== あみだ部分（スマホ対応） ===== */
.svg-container {
  width: 100%;
  max-width: 360px;
  margin: 0 auto;
}
svg {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  background-color: #fafafa;
}

/* ボタンを foreignObject の枠いっぱいに広げて中心をそろえる */
foreignObject button {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  font-size: 13px;
  font-weight: bold;
  border: 2px solid #9ca3af;
  border-radius: 8px;
  background-color: #fff;
  cursor: pointer;
}
foreignObject button:hover {
  background-color: #e0ecff;
  border-color: #3b82f6;
}
/* 下段（ゴール）は押せないので見た目を変える */
.goal button {
  background-color: #f3f4f6;
  cursor: default;
}
.goal button:hover {
  background-color: #f3f4f6;
  border-color: #9ca3af;
}

/* 下地のあみだ線 */
.ladder-bg line {
  stroke: #d1d5db;
  stroke-width: 3;
}

/* ===== 結果表示 ===== */
.result {
  margin-top: 16px;
  padding: 12px;
  background-color: #f9fafb;
  border: 1px solid #e5e7eb;
  border-radius: 8px;
  line-height: 1.8;
}
#judgment {
  font-size: 20px;
  font-weight: bold;
}

/* ===== 線のアニメーション ===== */
.animated-line {
  /* 線の長さ分の隙間を作って隠す */
  stroke-dasharray: var(--line-length);
  stroke-dashoffset: var(--line-length);
  stroke-linecap: round;
  /* 1秒かけて描画（速度を変えたいときは1sを調整） */
  animation: drawLineAnim 1s ease-out forwards;
}
@keyframes drawLineAnim {
  to {
    stroke-dashoffset: 0;
  }
}
</style>
</head>

<header>
  <h1>じゃんけん</h1>
</header>
<main>
  <h1>あみだじゃんけんしましょ！！！！</h1>

   <div class="svg-container">

    <!-- 下地のグレーあみだ線 -->

      <line x1="120" y1="38" x2="120" y2="218"/>

      <line x1="40" y1="128" x2="200" y2="128"/>

    <foreignObject class="goal" x="10" y="200" width="60" height="36">

      <button id="amida-btn5" data-col="1" xmlns="http://www.w3.org/1999/xhtml">2</button>

 </svg>

function drawLine(x1, y1, x2, y2, strokeColor = "red", strokeWidth = 3) {
  const line = document.createElementNS(SVG_NS, "line");
  line.setAttribute("x1", x1);
  line.setAttribute("y1", y1);
  line.setAttribute("x2", x2);
  line.setAttribute("y2", y2);
  line.setAttribute("stroke", strokeColor);
  line.setAttribute("stroke-width", strokeWidth);

  // 線の長さを計算（三平方の定理）
  const length = Math.hypot(x2 - x1, y2 - y1);
  line.style.setProperty("--line-length", `${length}px`);
  
  // アニメーション用クラスを付与
  line.classList.add("animated-line");

  layer.appendChild(line);
};
