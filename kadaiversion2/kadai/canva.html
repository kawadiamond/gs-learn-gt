<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>3択あみだくじ</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }

    /* スタートボタンの並び */
    .button-group {
      display: flex;
      gap: 12px;
      margin-bottom: 12px;
      width: 260px;
      justify-content: space-around;
    }

    .btn-start {
      padding: 6px 14px;
      font-size: 14px;
      cursor: pointer;
    }

    /* 下地のグレーあみだくじ */
    .ladder-bg line {
      stroke: #d0d7de;
      stroke-width: 4;
    }

    /* 動く線の共通設定 */
    .runner-path {
      fill: none;
      stroke-width: 5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0; /* 最初は非表示 */
    }

    /* 各ルートの線色 */
    #path-left   { stroke: #e03131; }
    #path-center { stroke: #2f9e44; }
    #path-right  { stroke: #1971c2; }

    /* ゴールラベル */
    .goal-labels {
      display: flex;
      width: 260px;
      justify-content: space-around;
      font-weight: bold;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- スタート選択ボタン -->
  <div class="button-group">
    <button class="btn-start" data-target="#path-left">左</button>
    <button class="btn-start" data-target="#path-center">中</button>
    <button class="btn-start" data-target="#path-right">右</button>
  </div>

  <svg width="260" height="320">
    <!-- 下地のあみだ枠（縦3本 + 横3本） -->
    <g class="ladder-bg">
      <!-- 縦線（X: 50, 130, 210） -->
      <line x1="50"  y1="20" x2="50"  y2="290" />
      <line x1="130" y1="20" x2="130" y2="290" />
      <line x1="210" y1="20" x2="210" y2="290" />

      <!-- 横棒 -->
      <line x1="50"  y1="80"  x2="130" y2="80" />
      <line x1="130" y1="150" x2="210" y2="150" />
      <line x1="50"  y1="220" x2="130" y2="220" />
    </g>

    <!-- 各スタートごとの走破ルート -->
    <!-- 左スタート：(50,20) → (50,80) → 右へ(130,80) → (130,150) → 右へ(210,150) → 下端(210,290) [右ゴール] -->
    <path id="path-left" class="runner-path"
          d="M 50,20 L 50,80 L 130,80 L 130,150 L 210,150 L 210,290" />

    <!-- 中スタート：(130,20) → (130,80) → 左へ(50,80) → (50,220) → 右へ(130,220) → 下端(130,290) [中ゴール] -->
    <path id="path-center" class="runner-path"
          d="M 130,20 L 130,80 L 50,80 L 50,220 L 130,220 L 130,290" />

    <!-- 右スタート：(210,20) → (210,150) → 左へ(130,150) → (130,220) → 左へ(50,220) → 下端(50,290) [左ゴール] -->
    <path id="path-right" class="runner-path"
          d="M 210,20 L 210,150 L 130,150 L 130,220 L 50,220 L 50,290" />
  </svg>

  <!-- ゴールの結果表示（あみだの構造に対応した結果） -->
  <div class="goal-labels">
    <span>賞品C</span>
    <span>当たり！</span>
    <span>ハズレ</span>
  </div>

  <script>
    // 各パスの初期準備（長さを測って隠す）
    $(".runner-path").each(function () {
      const len = this.getTotalLength();
      $(this).css({
        "stroke-dasharray": len,
        "stroke-dashoffset": len
      });
    });

    // ボタンクリック時の挙動
    $(".btn-start").on("click", function () {
      const targetSelector = $(this).data("target");
      const targetPath = $(targetSelector)[0];
      const len = targetPath.getTotalLength();

      // 他のボタンを連打できないよう一時的に無効化
      $(".btn-start").prop("disabled", true);

      // 全ルートを一旦リセット（非表示にして初期位置へ）
      $(".runner-path").css({
        "transition": "none",
        "opacity": 0
      }).each(function () {
        const l = this.getTotalLength();
        $(this).css("stroke-dashoffset", l);
      });

      // ブラウザにリセット状態を反映させるため、わずかな遅延（requestAnimationFrame）を入れてアニメーション開始
      requestAnimationFrame(() => {
        $(targetPath).css({
          "opacity": 1,
          "transition": "stroke-dashoffset 2.5s ease-in-out",
          "stroke-dashoffset": 0
        });
      });

      // 走破完了後（2.5秒後）にボタンを再度有効化
      setTimeout(() => {
        $(".btn-start").prop("disabled", false);
      }, 2500);
    });
  </script>

</body>
</html>
