    <li id="par_btn">パー</li>
  </ul>
  <div>コンピュータの出した手は？「<span id="pc_hands">なに？</span>」</div>

// ユーザ & コンピューター選択 //
// //ユーザー"グー"選択
let hand_c="0";
let hand_u="0";

//グー選択の場合
$("#gu_btn").on("click",function(){ 
  let hand_u=1;
  let hand_c=Math.ceil(Math.random()*3);
//コンピューターの手
if(hand_c==1){
  $("#pc_hands").html('<span>グー</span>');
}else if(hand_c==2){
  $("#pc_hands").html('<span>チョキ</span>');
} else if(hand_c==3){
  $("#pc_hands").html('<span>パー</span>');
};
  //勝利判定
if((hand_u ==1 && hand_c==2) || (hand_u ==2 && hand_c==3) || (hand_u == 3 && hand_c==1)){
    $("#judgment").html("<div>YOU Win</div>");
}else if (hand_u == hand_c == 1){
    $("#judgment").html("<div>Draw</div>");
} else {
   $("#judgment").html("<div>You Lost</div>");
}
});
